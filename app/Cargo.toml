[package]
name = "reminder-desktop"
version = "1.0.0"
edition = "2021"
description = "跨平台桌面提醒"
publish = false
license = "MIT"

[dependencies]
reminder-core = { path = "../core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs2 = "0.4"
i-slint-backend-winit = "=1.18.1"
rodio = "0.19"
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "system-tray",
] }
winit = "0.30.13"
image = { version = "0.25", default-features = false, features = ["png"] }
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(target_os = "linux")'.dependencies]
# 只用来回查会话总线（确认托盘图标是否真的注册上）。ksni 已经把 zbus 带进依赖树，
# 这里显式开 blocking-api，避免 Slint 吞掉注册失败后无从判断。Windows / macOS 的
# 托盘是同步的原生注册，用不到这个。
zbus = { version = "5.19", default-features = false, features = [
    "async-io",
    "blocking-api",
] }

[build-dependencies]
slint-build = "=1.18.1"
